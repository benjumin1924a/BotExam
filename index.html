<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>題庫複習</title>
  <style>
    :root { --navy:#153d66; --line:#222; --good:#c9f3cf; --bad:#ffcaca; --ink:#111; }
    * { box-sizing:border-box; }
    body { margin:0; background:#fff; color:var(--ink); font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; }
    header { padding:18px max(16px, calc((100% - 1800px)/2)); color:#fff; background:linear-gradient(120deg,#153d66,#226f9c); }
    h1 { margin:0; font-size:clamp(1.25rem, 3vw, 1.85rem); }
    header p { margin:6px 0 0; opacity:.9; }
    main { max-width:1800px; margin:16px auto; padding:0 10px 32px; }
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:#f3f3f3; padding:12px; border:1px solid #aaa; }
    .toolbar select, .toolbar input[type=search] { min-width:220px; border:1px solid #aebdcb; border-radius:4px; padding:9px 11px; font:inherit; background:#fff; }
    .toolbar input[type=search] { flex:1; }
    .filters { display:flex; gap:10px; align-items:center; white-space:nowrap; }
    button { border:1px solid #777; border-radius:3px; padding:6px 10px; color:#111; background:#f7f7f7; font:inherit; cursor:pointer; }
    button:hover { background:#e3e3e3; }
    button.secondary { background:#eee; }
    #count, #result-summary { color:#526170; font-size:.92rem; }
    #result-summary { font-weight:700; color:#163d66; }
    .table-wrap { overflow:auto; margin-top:12px; background:#fff; border:1px solid var(--line); }
    table { width:100%; border-collapse:collapse; }
    th { position:sticky; top:0; z-index:1; background:#eee; color:#111; padding:9px 7px; text-align:center; border:1px solid var(--line); font-size:1.1rem; }
    td { padding:12px 14px; vertical-align:top; border:1px solid var(--line); line-height:1.55; transition:background .2s; }
    td.number { width:82px; text-align:center; vertical-align:middle; font-size:1.2rem; font-weight:700; }
    td.correction { width:90px; text-align:center; vertical-align:middle; }
    td.answer { width:180px; vertical-align:middle; }
    td.basis { width:230px; vertical-align:middle; }
    td.notes { min-width:210px; vertical-align:middle; }
    .correct-answer { display:block; margin-top:8px; color:#08742d; font-size:1.35rem; font-weight:700; }
    .correct-answer[hidden] { display:none; }
    .option { display:flex; gap:5px; align-items:flex-start; margin:4px 0; cursor:pointer; font-size:1.12rem; }
    .option input { width:17px; height:17px; margin:5px 0 0; accent-color:#176b9b; flex:none; }
    .question-text { white-space:pre-wrap; font-weight:600; margin-bottom:8px; font-size:1.12rem; }
    .question-option { display:inline; }
    .basis-text { white-space:pre-wrap; font-weight:600; }
    .note-input { width:100%; min-height:72px; resize:vertical; border:1px solid transparent; background:transparent; font:inherit; line-height:1.55; }
    .note-input:focus { border-color:#8ba2b6; outline:0; background:#fff; }
    .note-actions { display:flex; gap:7px; margin-top:7px; }
    .note-actions button { padding:4px 9px; font-size:.9rem; }
    tr.is-correct td.correction { background:var(--good); }
    tr.is-correct .correct-answer { color:#08742d; }
    tr.is-wrong td.correction { background:var(--bad); }
    tr.is-wrong .correct-answer { color:#e11717; }
    tr.is-unanswered td.correction { background:#fff0bf; }
    tr[hidden] { display:none; }
    @media (max-width:760px) {
      header { padding:18px 16px; }
      main { padding:0 10px 28px; margin-top:12px; }
      .toolbar { display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:10px; }
      .toolbar > label { align-self:center; font-weight:700; }
      .toolbar select, .toolbar input[type=search] { grid-column:1 / -1; width:100%; min-width:0; }
      .filters { grid-column:1 / -1; justify-content:space-between; font-size:.94rem; }
      #correct-visible, #reset { min-height:40px; }
      #count, #result-summary { grid-column:1 / -1; text-align:right; }
      .table-wrap { overflow-x:auto; overflow-y:visible; border:0; background:transparent; -webkit-overflow-scrolling:touch; }
      table { min-width:calc(100vw + 290px); }
      table, tbody, tr, td { display:block; width:100%; }
      thead { display:none; }
      tbody { padding:0; }
      tr { display:grid; grid-template-columns:calc(100vw - 22px) 310px; grid-template-rows:auto auto auto auto; margin:12px 0; border:1px solid var(--line); background:#fff; box-shadow:0 1px 4px #152c4315; }
      td { display:grid; grid-template-columns:76px minmax(0, 1fr); gap:8px; padding:10px; border:0; border-bottom:1px solid #d8d8d8; line-height:1.55; }
      td:last-child { border-bottom:0; }
      td::before { content:attr(data-label); color:#40515e; font-weight:700; font-size:.92rem; }
      td.number, td.correction, td.answer, td.basis, td.notes { width:100%; min-width:0; text-align:left; vertical-align:top; font-size:1rem; }
      td[data-label="題目"] { grid-column:1; grid-row:1; }
      td.number { grid-column:1; grid-row:2; }
      td.correction { grid-column:1; grid-row:3; }
      td.answer { grid-column:1; grid-row:4; }
      td.basis { grid-column:2; grid-row:1 / span 2; border-left:1px solid #d8d8d8; }
      td.notes { grid-column:2; grid-row:3 / span 2; border-left:1px solid #d8d8d8; }
      td.number { align-items:center; font-size:1.1rem; }
      td.correction { align-items:start; }
      td.correction button { width:max-content; min-height:36px; }
      td.answer { align-items:start; }
      .option { display:inline-flex; margin:3px 13px 3px 0; font-size:1.08rem; }
      .option input { width:21px; height:21px; margin:2px 0 0; }
      .question-text { font-size:1.04rem; }
      .note-input { min-height:88px; }
      tr.is-correct td.correction, tr.is-wrong td.correction, tr.is-unanswered td.correction { background:inherit; }
      tr.is-correct { border-left:6px solid #1b8b45; }
      tr.is-wrong { border-left:6px solid #db3434; }
      tr.is-unanswered { border-left:6px solid #d99800; }
    }
  </style>
</head>
<body>
  <header><h1 id="page-title">題庫複習</h1><p id="topic-summary"></p></header>
  <main>
    <section class="toolbar" aria-label="題庫篩選">
      <label for="topic-select">選擇題庫：</label><select id="topic-select" aria-label="選擇題庫"></select>
      <input id="search" type="search" placeholder="搜尋題號、關鍵字或選項" aria-label="搜尋題目">
      <div class="filters">
        <label><input type="radio" name="filter" value="all" checked> 全部</label>
        <label><input type="radio" name="filter" value="single"> 單選</label>
        <label><input type="radio" name="filter" value="multiple"> 多選</label>
      </div>
      <button id="correct-visible">改正目前顯示題目</button>
      <button id="reset" class="secondary">重設作答</button>
      <span id="count"></span>
      <span id="result-summary" aria-live="polite"></span>
    </section>
    <div class="table-wrap"><table>
      <thead><tr><th>題庫號</th><th>改正</th><th>答案</th><th>題目</th><th>出題依據</th><th>筆記</th></tr></thead>
      <tbody id="questions"></tbody>
    </table></div>
  </main>
  <script>
    const topics = [{"id": 1, "title": "第1篇－存匯（115年）", "questions": [{"number": 1, "answer": ["1"], "type": "single", "prompt": "退休老師劉君旅居山東，於優惠存款到期時，應如何辦理續存：", "options": [{"id": "1", "text": "親自持相關證件辦理"}, {"id": "2", "text": "以書面通訊方式辦理"}, {"id": "3", "text": "檢附相關證件委託親友代辦。"}], "basis": "【優惠存款辦法第九條】"}, {"number": 2, "answer": ["1"], "type": "single", "prompt": "陳君於113年5月8、11、12日陸續質借優惠存款金額未還，惟其於5月11日亡故，5月22日其繼承人來行辦理繼承手續並收取質借息，請問應退還質借息之期間為何？", "options": [{"id": "1", "text": "113年5月12日至同月21日"}, {"id": "2", "text": "113年5月11日至同月21日"}, {"id": "3", "text": "113年5月8日至同月21日。"}], "basis": "【優惠存款-銷戶標準作業流程SOP】"}, {"number": 3, "answer": ["2"], "type": "single", "prompt": "本行於接獲機關通知優存戶再任公職時，下列敘述何者為真", "options": [{"id": "1", "text": "本行應主動將優惠存款辦理銷戶手續"}, {"id": "2", "text": "優存戶來行辦理優惠存款銷戶手續，應開立停止退休(職/伍)金優惠儲蓄存款證明書交付"}, {"id": "3", "text": "再任公職期間仍可申請質借。"}], "basis": "【優惠存款－銷戶標準作業流程SOP】"}, {"number": 4, "answer": ["3"], "type": "single", "prompt": "退休教育人員丁君之優惠存款113年1月1日到期，未及辦理續存手續即於114年4月15日亡故，其家屬於114年6月10日辦理繼承手續，其優惠存款停止日", "options": [{"id": "1", "text": "114年4月15日"}, {"id": "2", "text": "114年6月10日"}, {"id": "3", "text": "113年1月1日。"}], "basis": "【優惠存款辦法第九條】"}, {"number": 5, "answer": ["2"], "type": "single", "prompt": "退休人員優惠存款差額息負擔機關為", "options": [{"id": "1", "text": "臺灣銀行"}, {"id": "2", "text": "退撫新制實施前退休金之支給機關"}, {"id": "3", "text": "退撫新制實施後退休金之支給機關。"}], "basis": "【優惠存款辦法第十五條】"}, {"number": 6, "answer": ["1"], "type": "single", "prompt": "甲君之優惠存款於116年1月1日到期，115年5月5日優存被扣押解繳，115年6月10日將扣押款回存至優惠存款帳戶，甲君於115年7月22日來行辦理恢復優惠手續，應自", "options": [{"id": "1", "text": "115年6月10日"}, {"id": "2", "text": "115年5月5日"}, {"id": "3", "text": "115年7月22日 起算優惠存款利息。"}], "basis": "【優惠存款辦法第十二條、優惠存款－開戶標準作業流程SOP】"}, {"number": 7, "answer": ["2"], "type": "single", "prompt": "有關優惠存款敘述下列何者為是？", "options": [{"id": "1", "text": "得設定質權於第三人"}, {"id": "2", "text": "質借期限以不超過優存契約期滿日"}, {"id": "3", "text": "不限在原存款單位辦理質借。"}], "basis": "【優惠存款辦法第十一條】"}, {"number": 8, "answer": ["2"], "type": "single", "prompt": "本行辦理 債信不良，恐甲之支票存款帳戶中之存款，遭他人持票提領，致甲無法清償其貸款，Ｂ銀行為保全債權下列做法何者正確且於法有據﹖", "options": [{"id": "1", "text": "圈存支票存款帳戶中之存款，「逕」對甲主張抵銷"}, {"id": "2", "text": "主張甲之貸款契約中訂定約定抵銷之條款，Ｂ得逕依該條款主張抵銷"}, {"id": "3", "text": "終止與存戶間之支票存款往來契約，並就返還存款之義務主張抵銷。"}], "basis": "【最高法院57.3.12.第1次民刑庭總會決議（一）】"}, {"number": 11, "answer": ["3"], "type": "single", "prompt": "銀行之保管箱業務，屬於何種法律性質之契約？", "options": [{"id": "1", "text": "寄託契約"}, {"id": "2", "text": "倉庫契約"}, {"id": "3", "text": "租賃契約  之性質。"}], "basis": "【民法第589、613、421條、金融機構保管箱出租定型化契約範本第1條】"}, {"number": 12, "answer": ["1"], "type": "single", "prompt": "銀行處理匯款業務，並受有匯費之報酬，應盡何種注意義務？", "options": [{"id": "1", "text": "善良管理人之注意義務"}, {"id": "2", "text": "與處理自己事務為同一之注意義務"}, {"id": "3", "text": "一般人之注意義務。"}], "basis": "【民法第535條、臺灣高等法院105年度上易字第206號民事判決】"}, {"number": 13, "answer": ["1"], "type": "single", "prompt": "有關一般債權質權之設定，何者為正確﹖", "options": [{"id": "1", "text": "其設定應以書面為之，如債權有證書者，應交付其證書予債權人，並通知第三債務人"}, {"id": "2", "text": "其設定應以書面為之，如債權有證書者，應交付其證書予第三債務人以代通知"}, {"id": "3", "text": "其設定應以書面為之，如債權有證書者，應背書交付其證書予第三債務人以代通知。"}], "basis": "【民法第902、904條】"}, {"number": 14, "answer": ["3"], "type": "single", "prompt": "存款人將其銀行存款債權設定質權予其債權人，若質權設定契約書並未明定存款利息之歸屬，則質權效力依法及於該存款之部分為何﹖", "options": [{"id": "1", "text": "僅本金"}, {"id": "2", "text": "僅利息"}, {"id": "3", "text": "本金及利息。"}], "basis": "【民法第901、889條】"}, {"number": 15, "answer": ["2"], "type": "single", "prompt": "存款人將其銀行定期存款債權設定質權予其債權人者，以下敘述何者為正確﹖", "options": [{"id": "1", "text": "質權未消滅前，銀行基於存款人之請求，依法得同意存款人取回其設質之存款"}, {"id": "2", "text": "質權未消滅前，銀行非經質權人之同意，不得同意存款人取回其設質之存款"}, {"id": "3", "text": "以上皆非。"}], "basis": "【民法第903條】"}, {"number": 16, "answer": ["3"], "type": "single", "prompt": "銀行之存款戶甲具榮民身分，身故後，僅有唯一之大陸地區繼承人乙，請問甲在銀行之存款1000萬元，應如何處理？", "options": [{"id": "1", "text": "由乙至銀行領取甲之全部存款1000萬元"}, {"id": "2", "text": "由銀行逕行給付乙新臺幣200萬元，其餘800萬元歸繳國庫"}, {"id": "3", "text": "由銀行交由國軍退除役官兵輔導委員會管理。"}], "basis": "【臺灣地區與大陸地區人民關係條例第68條】"}, {"number": 17, "answer": ["2"], "type": "single", "prompt": "張三在銀行有新臺幣500萬元之存款(無其他財產)，除在大陸地區有子甲(大陸地區人民)外，在臺灣地區僅有妹乙(臺灣地區人民)一人，請問張三亡故後，其存款應如何分配？", "options": [{"id": "1", "text": "全部存款由甲繼承並領取"}, {"id": "2", "text": "甲繼承新臺幣200萬元，其餘300萬元歸屬予乙"}, {"id": "3", "text": "甲繼承新臺幣200萬元，其餘300萬元歸屬國庫。"}], "basis": "【臺灣地區與大陸地區人民關係條例第67條第1項】"}, {"number": 18, "answer": ["2"], "type": "single", "prompt": "銀行存款戶王五(具榮民身分)死亡，有臺灣地區繼承人甲及大陸地區繼承人乙，則下列敘述，何者正確？", "options": [{"id": "1", "text": "甲應於繼承開始時起三年內以書面向王五住所地之法院為繼承之表示；逾期視為拋棄其繼承權"}, {"id": "2", "text": "乙應於繼承開始時起三年內以書面向王五住所地之法院為繼承之表示；逾期視為拋棄其繼承權"}, {"id": "3", "text": "乙應於繼承開始時起四年內以書面向王五住所地之法院為繼承之表示；逾期視為拋棄其繼承權。"}], "basis": "【臺灣地區與大陸地區人民關係條例第66條、民法第1148條】"}, {"number": 19, "answer": ["3"], "type": "single", "prompt": "存款戶甲(一般人民)在銀行有存款1000萬元，甲亡故後，在臺灣地區無繼承人，其在大陸地區唯一之繼承人乙來行領取甲在銀行之存款。請問下列敘述，何者為正確？", "options": [{"id": "1", "text": "銀行須先審查乙有無於繼承開始時起三年內，以書面向甲住所地之法院為繼承之表示，若有，銀行得將1000萬元之存款逕行同意由乙委託之人領取"}, {"id": "2", "text": "甲之存款未逾新臺幣200萬元部分，銀行可逕行同意由乙或其委託之人領取"}, {"id": "3", "text": "應由乙或銀行(利害關係人)或檢察官聲請法院指定財政部國有財產局為遺產管理人後，由銀行將甲之存款交其管理。"}], "basis": "【臺灣地區與大陸地區人民關係條例第67條之1】"}, {"number": 20, "answer": ["3"], "type": "single", "prompt": "甲男、乙女於民國三十八年間在大陸地區結婚後，因重大變故，致甲男在臺灣地區，乙女在大陸地區。其後，甲男於民國五十八年間在臺北市與丙女結婚，丙女於婚姻中自甲男受胎，生有一子Ａ。甲嗣於今年二月間過世，其在銀行有存款。若甲過世時，乙、丙、Ａ均仍生存，則下列敘述，何者正確？", "options": [{"id": "1", "text": "若乙於民國四十八年間已改嫁他人，則乙與甲間之原婚姻關係自乙於民國四十八年間另嫁他人之日起消滅，故乙不得繼承甲之存款。"}, {"id": "2", "text": "若乙迄未改嫁，則丙係甲重婚之配偶，丙與甲間之後婚姻關係當然無效，故丙、Ａ均不得繼承甲之存款。"}, {"id": "3", "text": "若乙迄未改嫁，則乙、丙均為甲之合法配偶，故乙、丙、Ａ均得繼承甲之存款。"}], "basis": "【臺灣地區與大陸地區人民關係條例第64條第1項前段、第2項及其反面解釋】"}, {"number": 21, "answer": ["3"], "type": "single", "prompt": "下列敘述何者正確？", "options": [{"id": "1", "text": "行為能力始於出生，終於死亡"}, {"id": "2", "text": "未滿7歲之未成年人，無權利能力"}, {"id": "3", "text": "胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生。"}], "basis": "【民法第6、7、13條】"}, {"number": 22, "answer": ["2"], "type": "single", "prompt": "甲向Ｂ銀行借款500萬元，為逃避Ｂ銀行之強制執行，乃與乙通謀，將其所有之土地出賣給乙，並完成土地所有權移轉登記。以下有關敘述，何者正確？", "options": [{"id": "1", "text": "甲乙間之土地買賣契約及物權移轉契約須經聲請法院撤銷，始得視為無效。"}, {"id": "2", "text": "甲與乙係通謀而為虛偽意思表示，故就甲乙而言，其間之土地買賣契約及物權移轉契約無效。"}, {"id": "3", "text": "倘乙隨即將土地出賣給「知情」之丙，並辦妥所有權移轉登記，丙將因信賴登記而取得該土地所有權。"}], "basis": "【民法第87、759-1條、土地法第43條】"}, {"number": 23, "answer": ["3"], "type": "single", "prompt": "債務人向債權人承認其債務後，其效力為何？", "options": [{"id": "1", "text": "債權人未於6個月內起訴，時效視為不中斷。"}, {"id": "2", "text": "債務人如撤回其承認，時效視為不中斷。"}, {"id": "3", "text": "時效因之中斷而重行起算。"}], "basis": "【民法第129條】"}, {"number": 24, "answer": ["1"], "type": "single", "prompt": "有關時效中斷之效力，下列敘述何者正確？", "options": [{"id": "1", "text": "時效中斷之事由終止時，時效重行起算。"}, {"id": "2", "text": "因起訴而中斷之時效，自受終局判決時，重行起算。"}, {"id": "3", "text": "請求權經取得任何執行名義後，其原有消滅時效期間不滿5年者，因中斷而重行起算之時效期間為5年。"}], "basis": "【民法第137條】"}, {"number": 25, "answer": ["3"], "type": "single", "prompt": "甲持有乙簽發之支票一紙，經提示請求未獲兌付。甲乃訴請乙給付票款，並取得勝訴確定判決，則甲對乙之請求權消滅時效期間：", "options": [{"id": "1", "text": "自訴訟繫屬於法院時起，重行起算5年"}, {"id": "2", "text": "自受確定判決時起，重行起算1年"}, {"id": "3", "text": "自受確定判決時起，重行起算5年。"}], "basis": "【民法第137條第2項及第3項、票據法第22條】"}, {"number": 26, "answer": ["2"], "type": "single", "prompt": "甲向Ｂ銀行借款，並簽發額度本票交由該行存執，嗣後甲未依約清償本金，經Ｂ銀行宣告其債務視為全部到期後即依法訴追；惟就本票部分則漏未請求，致對甲之票款請求權罹於時效，試問其效力如何？", "options": [{"id": "1", "text": "Ｂ銀行對甲之票據權利消滅。"}, {"id": "2", "text": "甲取得拒絕履行其票據債務之抗辯權。"}, {"id": "3", "text": "甲取得拒絕履行其借款債務之抗辯權。"}], "basis": "【民法第144條】"}, {"number": 27, "answer": ["2"], "type": "single", "prompt": "甲向銀行借款，約定清償期為73.2.10，並設定不動產抵押權為擔保，甲屆期未履行債務，銀行於87.10.1前去函3次求償未果，乃於88.3.1第4次請求，詎仍不獲置理，銀行遂於88.4.7對甲起訴。下列有關敘述何者正確？", "options": [{"id": "1", "text": "時效因請求而中斷，銀行曾不斷為請求，且於87.10.1請求後之6個月內已另為請求，故甲不得拒絕給付。"}, {"id": "2", "text": "銀行起訴時，其請求權時效業已消滅，惟銀行仍得於時效完成後5年內對抵押物取償。"}, {"id": "3", "text": "銀行得就抵押物取償之範圍包括甲之貸款本金及利息。"}], "basis": "【民法第130、145、880條、最高法院71年台上字第3435號判例】"}, {"number": 28, "answer": ["3"], "type": "single", "prompt": "以下有關銀行為維護其放款債權所採行之措施，何者正確？", "options": [{"id": "1", "text": "要求借款人出具預先拋棄時效利益之書面聲明。"}, {"id": "2", "text": "放款約據中特約加長銀行債權時效期間一律為30年。"}, {"id": "3", "text": "逾期放款應留意其時效期間之規定，及時中斷之。"}], "basis": "【民法第147條】"}, {"number": 29, "answer": ["2"], "type": "single", "prompt": "某一貸款案，借款人為甲，抵押物提供人亦為甲(設定一般抵押權)，就法律而言，試問下列敘述何者正確﹖", "options": [{"id": "1", "text": "甲設定抵押權同時向Ｂ銀行借貸款項，該設定抵押權之行為屬無償行為"}, {"id": "2", "text": "先有債權存在，而於事後增提擔保物設定抵押權者，若無對價關係，該設定抵押權之行為屬無償行為"}, {"id": "3", "text": "不論該抵押權之設定是否有害及甲之其他債權人之債權，甲之其他債權人均得撤銷該抵押權之設定。"}], "basis": "【民法第244條、最高法院51年台上字第3528號判例】"}, {"number": 30, "answer": ["1"], "type": "single", "prompt": "借款戶甲逾期未繳本息，Ｂ銀行擬行使「代位權」代位甲主張其權利，下列有關代位權(民法第242條)之敘述何者正確﹖", "options": [{"id": "1", "text": "須以債權人自己之名義行使"}, {"id": "2", "text": "必須於審判中行使"}, {"id": "3", "text": "專屬於債務人本身之債權亦可代位。"}], "basis": "【民法第242條、最高法院69年台抗字第240號判例】"}, {"number": 31, "answer": ["1"], "type": "single", "prompt": "借款戶甲逾期未繳本息，Ｂ銀行發現甲有脫產之現象，故擬行使「撤銷權」撤銷甲之脫產行為，下列有關撤銷權(民法第244 條)除斥期間之敘述何者正確﹖", "options": [{"id": "1", "text": "自Ｂ銀行知有撤銷原因時起，1年間不行使而消滅"}, {"id": "2", "text": "自甲為脫產行為時起，1年間不行使而消滅"}, {"id": "3", "text": "自甲為脫產行為時起經過5年而消滅。"}], "basis": "【民法第245條】"}, {"number": 32, "answer": ["3"], "type": "single", "prompt": "甲提供其所有之房地設定最高限額抵押權向Ｂ銀行借款新臺幣一百萬元，嗣後未依約繳納本息，Ｂ銀行行使抵押權查封抵押物時，發現抵押之房地在抵押權設定前已出租予乙並由乙占有使用中，於拍賣期間適租期屆滿，乙仍繼續使用，甲未即為反對之表示，該房地為丙拍定，取得權利移轉證書，就法律而言，下列陳述何者正確﹖", "options": [{"id": "1", "text": "若租賃權對抵押權有所影響時，執行法院將除去租賃權"}, {"id": "2", "text": "乙主張「買賣不破租賃」，其與拍定人丙間有租賃關係永續存在，為有理由"}, {"id": "3", "text": "乙不能主張民法第四百五十一條所定默示更新不定期繼續租約之效果，乙占有該房地係無權占有。"}], "basis": "【強制執行法第98條第2項、最高法院67.8.29.第9次民庭庭推總會決議（二）】"}, {"number": 33, "answer": ["3"], "type": "single", "prompt": "Ａ公司向Ｂ銀行借款，借款返還請求權時效消滅前一日Ｂ銀行以存證信函向Ａ公司請求返還借款，並於一個月後對Ａ公司暨連帶保證人甲起訴，以下敘述，何者正確﹖", "options": [{"id": "1", "text": "Ａ公司不可為時效之抗辯、甲可為時效之抗辯"}, {"id": "2", "text": "Ａ公司可為時效之抗辯、甲不可為時效之抗辯"}, {"id": "3", "text": "Ａ公司不可為時效之抗辯、甲不可為時效之抗辯。"}], "basis": "【民法第129、130、747條】"}, {"number": 34, "answer": ["1"], "type": "single", "prompt": "Ａ公司向Ｂ銀行借款，借款返還請求權時效消滅前一日Ａ公司主動向Ｂ銀行聲請展期並出具承諾書，承諾就其所借之款項仍願繼續負責清償。五日後Ｂ銀行決定不接受其展期之聲請，並對Ａ公司暨連帶保證人甲起訴，以下敘述，何者正確﹖", "options": [{"id": "1", "text": "Ａ公司不可為時效之抗辯、甲可為時效之抗辯"}, {"id": "2", "text": "Ａ公司可為時效之抗辯、甲不可為時效之抗辯"}, {"id": "3", "text": "Ａ公司不可為時效之抗辯、甲不可為時效之抗辯。"}], "basis": "【民法第129、747條，最高法院68年台上字第1813號判例】"}, {"number": 35, "answer": ["1"], "type": "single", "prompt": "甲向Ｋ銀行借款，由乙擔任連帶保證人，並以甲所有之Ａ地及丙所有之Ｂ地設定抵押權擔保，嗣後甲因擬與丁合建房屋，遂更換擔保品，塗銷Ａ地之抵押權登記，換以價值更高之Ｃ地設定抵押權擔保，以下敘述，何者正確﹖", "options": [{"id": "1", "text": "乙得以Ｋ銀行未經其同意而拋棄抵押權為由，主張在Ｋ銀行所拋棄抵押權之限度內，免其責任"}, {"id": "2", "text": "Ｋ銀行主張抵押權標的物由Ａ地換為Ｃ地並非單純的拋棄抵押權，乙不得因此而減免保證責任"}, {"id": "3", "text": "Ｋ銀行主張本案Ｃ地較Ａ地更有價值，乙不得因此而減免保證責任。"}], "basis": "【民法第751條、最高法院44.6.7.民刑庭總會會議決議（二）、最高法院44年台上659號判例】"}, {"number": 36, "answer": ["1"], "type": "single", "prompt": "甲向Ｂ銀行借款，由乙擔任連帶保證人，並由好友丙以其所有之房屋一棟為甲提供擔保，設定最高限額抵押權。嗣後清償期屆至甲無力清償，聲請展期，Ｂ銀行同意其聲請，以下敘述，依民法之規定，何者正確﹖", "options": [{"id": "1", "text": "因Ｂ銀行未徵得乙同意，即與甲約定延期清償，乙可主張其不負保證責任"}, {"id": "2", "text": "因Ｂ銀行未徵得丙同意，即與甲約定延期清償，丙可主張其保證責任消滅，要求塗銷抵押權登記"}, {"id": "3", "text": "Ｂ銀行主張不論物保、人保仍均應負擔保之責。"}], "basis": "【民法第755條、最高法院75.12.27.第24次民事庭會議決議（一）】"}, {"number": 37, "answer": ["3"], "type": "single", "prompt": "客戶辦理不動產抵押貸款，其中貸款銀行於何時取得抵押權﹖", "options": [{"id": "1", "text": "簽訂抵押權設定契約書時"}, {"id": "2", "text": "持抵押權設定契約書向地政機關收發人員辦理送件時"}, {"id": "3", "text": "地政機關依土地登記規則之規定完成設定登記時。"}], "basis": "【民法第758條、土地登記規則第6條】"}, {"number": 38, "answer": ["2"], "type": "single", "prompt": "有關依契約約定之抵押權之敘述何者正確﹖", "options": [{"id": "1", "text": "不動產所有權人僅得就其不動產價值範圍內設定一個順位之抵押權"}, {"id": "2", "text": "依契約約定之抵押權應以書面契約為之，並經登記始取得抵押權"}, {"id": "3", "text": "當事人不得就二筆以上之不動產一併設定於同一抵押權契約中。"}], "basis": "【民法第758、875條】"}, {"number": 39, "answer": ["3"], "type": "single", "prompt": "以下敘述何者為正確﹖", "options": [{"id": "1", "text": "不動產所有人設定抵押後應經抵押權人之同意，始得將抵押物出租"}, {"id": "2", "text": "抵押權之效力及於抵押物設定抵押後之租金"}, {"id": "3", "text": "不動產所有人設定抵押後將抵押物出租，抵押權不因此而受影響。"}], "basis": "【民法第866、864條】"}, {"number": 40, "answer": ["3"], "type": "single", "prompt": "最高限額抵押權設定時約定其所擔保原債權應確定之期日，該約定確定之期日，自抵押權設定起，最長不得逾幾年？", "options": [{"id": "1", "text": "10年"}, {"id": "2", "text": "20年"}, {"id": "3", "text": "30年。"}], "basis": "【民法第881條之4第2項】"}, {"number": 41, "answer": ["1"], "type": "single", "prompt": "土地所有權人，於設定抵押權後，在抵押之土地上營造有獨立經濟價值之建築物者，若其所有權均未變動，抵押權人於必要時，得於強制執行程序中聲請法院為如何之處置及其效力﹖", "options": [{"id": "1", "text": "得將建物與土地併付拍賣，但僅對土地之價金有優先受償權"}, {"id": "2", "text": "得將建物與土地併付拍賣，且對土地及建物均有優先受償權"}, {"id": "3", "text": "僅得就土地拍賣優先受償，不得就建物拍賣。"}], "basis": "【民法第877條】"}, {"number": 42, "answer": ["3"], "type": "single", "prompt": "最高限額抵押權之標的物，經他債權人之聲請強制執行而查封者，最高限額抵押權所擔保之原債權於何時告確定﹖", "options": [{"id": "1", "text": "他債權人將執行查封聲請狀送法院繫屬時"}, {"id": "2", "text": "法院實施查封行為或查封通知到達登記機關時"}, {"id": "3", "text": "最高限額抵押權人知悉查封事實或經執行法院通知最高限額抵押權人時。"}], "basis": "【民法第881條之12第1項第6款】"}, {"number": 43, "answer": ["1"], "type": "single", "prompt": "設定本金最高限額新臺幣一千二百萬元之不動產抵押權，若約定擔保之債權包含本金、利息、遲延利息、違約金，則抵押權人得優先受償之敘述，何者正確﹖", "options": [{"id": "1", "text": "本金、利息、遲延利息、違約金合併計算，如超過該限額，超過部分即無優先受償權"}, {"id": "2", "text": "僅本金受該限額之限制，利息、遲延利息、違約金等金額不受該限額之限制"}, {"id": "3", "text": "僅本金得優先受償，且限於新臺幣一千二百萬元範圍內。"}], "basis": "【民法第881條之2】"}, {"number": 44, "answer": ["3"], "type": "single", "prompt": "房屋貸款之客戶，以其房地設定普通抵押權與銀行，以擔保所貸該筆款項，以下敘述何者為正確﹖", "options": [{"id": "1", "text": "該抵押權得擔保該客戶設定抵押後陸續所貸之款項"}, {"id": "2", "text": "該抵押權所擔保該筆貸款償清後，在設定金額範圍內得擔保另貸之款項"}, {"id": "3", "text": "該抵押權所擔保該筆貸款償清後，該抵押權縱未辦理塗銷登記，亦將因所擔保之債權清償而消滅。"}], "basis": "【民法第870條】"}, {"number": 45, "answer": ["1"], "type": "single", "prompt": "以下敘述何者為正確﹖", "options": [{"id": "1", "text": "甲乙丙共有土地一筆，應有部分各三分之一，甲得將其應有部分三分之一設定抵押權予Ａ銀行"}, {"id": "2", "text": "甲乙丙共有土地一筆，應有部分各三分之一，則甲得將該土地全部設定抵押權予Ａ銀行"}, {"id": "3", "text": "甲乙丙繼承其父土地遺產一筆，於未經分割前，甲得將該土地之三分之一設定抵押權予Ａ銀行。"}], "basis": "【民法第819、828、1151條，土地法第34條之1】"}, {"number": 46, "answer": ["3"], "type": "single", "prompt": "甲以其土地設定三次序之最高限額抵押權，抵押權人依序為：乙、丙、丁，則以下敘述何者為正確﹖", "options": [{"id": "1", "text": "乙丙丁抵押權之次序，是以當事人訂立抵押權契約日期決定"}, {"id": "2", "text": "乙之抵押權確定時並無任何債權存在，惟確定後乙對甲取得一筆A債權，則丙丁之抵押債權受償順位仍次於乙之A債權"}, {"id": "3", "text": "乙擬提高設定金額，應徵得丙丁之同意始得逕為變更登記，否則應就增加部分另行辦理設定登記。"}], "basis": "【民法第865條、881條之12、881條之14，土地登記規則第115條】"}, {"number": 47, "answer": ["1"], "type": "single", "prompt": "某甲將其不動產設定第一順位最高限額抵押權予Ａ銀行，以擔保借款債權並貸得款項，則以下敘述何者正確﹖", "options": [{"id": "1", "text": "若該抵押權約定之原債權確定期日尚未屆至，又另向Ａ銀行辦理另定新約續借，在設定金額範圍內，該抵押權之效力及於另定新約之借款"}, {"id": "2", "text": "若該抵押權約定之原債權確定期日已屆至後，又另向Ａ銀行辦理另定新約續借，在設定金額範圍內，該抵押權之效力及於另定新約之借款"}, {"id": "3", "text": "若該抵押權約定之原債權確定期日已屆至後，原向Ａ銀行所貸之借款辦理延期清償，則縱在設定金額範圍內，該延期清償之借款已非該抵押權所擔保。"}], "basis": "【民法第881條之12、881條之14】"}, {"number": 48, "answer": ["2"], "type": "single", "prompt": "甲提供其所有之土地設定最高限額抵押權擔保Ｂ公司對Ａ銀行之借款債務，嗣後Ｂ公司與Ｃ公司合併，甲於二公司合併登記之第三日得知此訊息，試問：甲自知悉合併之日起幾日內，得向Ａ銀行請求確定最高限額抵押權？", "options": [{"id": "1", "text": "十日"}, {"id": "2", "text": "十五日"}, {"id": "3", "text": "二十日。"}], "basis": "【民法第881條之7第1項】"}, {"number": 49, "answer": ["2"], "type": "single", "prompt": "甲將其所有之土地Ａ，乙將其所有之土地Ｂ設定抵押權予銀行，並未限定Ａ、Ｂ各應負擔之金額，共同擔保丙向銀行所借之貸款，某丙貸款逾期不還時，則以下敘述何者為正確﹖", "options": [{"id": "1", "text": "銀行必須就Ａ、Ｂ兩筆土地同時進行拍賣，不得單獨拍賣其中一筆"}, {"id": "2", "text": "銀行得先賣Ａ土地，就該土地之全部價金受償，若有不足另拍賣Ｂ土地"}, {"id": "3", "text": "銀行得就ＡＢ二筆土地先後分別拍賣，惟銀行就該各筆土地之價金僅得於債務之二分之一之範圍內受償。"}], "basis": "【民法第875條】"}, {"number": 50, "answer": ["2"], "type": "single", "prompt": "張三向甲銀行借款，並同意以其所持有乙股份有限公司發行之股票設定權利質權作為擔保，以下敘述，何者正確﹖", "options": [{"id": "1", "text": "若質權標的為股票，則張三僅需將股票交付銀行即生設質之效力，且甲銀行得據以對抗乙公司，享有質權人權利"}, {"id": "2", "text": "若張三將其持有之股票背書交付甲銀行，並向乙股份有限公司辦理質權設定登記手續後，該公司決議分派各股東現金股利，則張三受分派之現金股利，亦為權利質權效力所及"}, {"id": "3", "text": "以上皆是。"}], "basis": "【民法第889、901、902、908條，公司法第164、165條，最高法院60年台上字第4335號判例，最高法院63.5.28第3次民庭庭推總會議決議（二）】"}, {"number": 51, "answer": ["2"], "type": "single", "prompt": "以下敘述，何者正確﹖", "options": [{"id": "1", "text": "某私立學校以其所有不動產設定抵押權予銀行以申貸款項，則該校就該不動產之設押行為，僅須經該校董事會特別決議同意後，即合法有效"}, {"id": "2", "text": "財團法人基督教醫院擬以其所有之不動產設定抵押權予銀行以申貸款項，則該不動產之設定行為，應經中央衛生主管機關核准，否則不生效力"}, {"id": "3", "text": "舉凡公司將其不動產設定抵押權予銀行作為他人借款之擔保，於完成設定登記後，其抵押權均合法有效。"}], "basis": "【私立學校法第49條、醫療法第36條、最高法院74年台上字第703號判例】"}, {"number": 52, "answer": ["2"], "type": "single", "prompt": "甲公司以其所有之機器設定動產抵押權予Ｂ銀行，以擔保甲公司之債務，並登記有效期間為十年，則以下敘述，何者正確﹖", "options": [{"id": "1", "text": "該有效期間為時效期間，因Ｂ銀行對甲公司起訴而生中斷有效期間計算之效力"}, {"id": "2", "text": "Ｂ銀行於十年之登記有效期間屆滿後，疏於辦理延長登記，惟為實現債權乃聲請法院拍賣抵押之機器，始發現抵押之機器已出售予善意之乙，則Ｂ銀行不得以原設定之動產抵押權對抗乙，故Ｂ銀行不得據以實行動產抵押權。"}, {"id": "3", "text": "甲、Ｂ銀行間原設定之動產抵押權登記有效期間為十年，該期間屆滿前，甲公司人去樓空，則Ｂ銀行於有效期間屆滿前三十日內，可單方面聲請延長有效期間一年，且以一次為限。"}], "basis": "【動產擔保交易法第9條、最高法院60年台上字第3206號判例、最高法院67.4.25.第4次民事庭庭推總會會議決議】"}, {"number": 53, "answer": ["3"], "type": "single", "prompt": "金融消費者保護法規定，金融消費者就金融消費爭議事件應先向金融服務業提出申訴，金融服務業應於收受申訴之日起幾日內為適當之處理，並將處理結果回覆提出申訴之金融消費者", "options": [{"id": "1", "text": "10日"}, {"id": "2", "text": "20日"}, {"id": "3", "text": "30日。"}], "basis": "【金融消費者保護法第13條第2項】"}, {"number": 54, "answer": ["2"], "type": "single", "prompt": "甲之妻過世後，甲之岳父將別墅一棟，贈與甲之10歲女兒某乙，並登記為乙之名義。問：下列敘述，何者正確？", "options": [{"id": "1", "text": "因甲係乙之法定代理人，故甲將乙名下之上開別墅設定抵押權以擔保甲個人對銀行所負借款債務，該抵押權設定行為絕對有效。"}, {"id": "2", "text": "甲在乙成年之前，得將乙名下之上開別墅出租予他人，並按月收取租金。"}, {"id": "3", "text": "甲為償還賭債，經親屬會議允許，將乙名下之上開別墅設定抵押權向銀行貸款，如甲提出該親屬會議之決議為證，則該抵押權之設定行為絕對有效。"}], "basis": "【(1)民法第1088條第2項但書、最高法院42年台上字第126號判例。(2)民法第1088條第2項本文。(3)民法第1088條第2項但書】"}, {"number": 55, "answer": ["3"], "type": "single", "prompt": "銀行之債務人甲，有妻乙、二子Ａ及Ｂ（註：Ａ已歿），Ａ有二女Ｃ及Ｄ。嗣甲因出國旅遊，不幸飛機失事死亡，假設各繼承人均未拋棄繼承，請問何人應繼承甲所負債務？", "options": [{"id": "1", "text": "乙、Ｂ"}, {"id": "2", "text": "Ｂ、Ｃ、Ｄ"}, {"id": "3", "text": "乙、Ｂ、Ｃ、Ｄ。"}], "basis": "【民法第1138、1140、1148條】"}, {"number": 56, "answer": ["1"], "type": "single", "prompt": "銀行之債務人李四亡故後，有父甲、配偶乙、子丙，丙生有二男丁、戊。倘丙拋棄繼承，則下列敘述，何者正確？", "options": [{"id": "1", "text": "銀行應對乙、丁、戊提起請求清償債務之訴"}, {"id": "2", "text": "銀行應對甲、乙提起請求清償債務之訴"}, {"id": "3", "text": "銀行僅可對甲提起請求清償債務之訴。"}], "basis": "【民法第1176條第5項、第1138條】"}, {"number": 57, "answer": ["2"], "type": "single", "prompt": "甲向銀行借款，甲過世後，遺有一子乙及二女丙、丁，則下列敘述，何者正確？", "options": [{"id": "1", "text": "乙以書面向丙、丁為拋棄繼承之意思表示，銀行即不得向乙請求清償借款"}, {"id": "2", "text": "乙、丙、丁於甲過世前，與甲簽訂有拋棄繼承之契約書，銀行仍得向乙、丙、丁請求清償借款"}, {"id": "3", "text": "乙拋棄繼承，丙、丁視為同為拋棄繼承。"}], "basis": "【民法第1174條、最高法院89年台上字第595號判決】"}, {"number": 58, "answer": ["2"], "type": "single", "prompt": "Ａ銀行於87年間與連帶保證人簽訂之契約中明文約定「銀行允許借款人延期清償，無須徵得保證人同意，保證人仍願負保證責任」，嗣民法於89年5月5日施行之修正條文增訂第739條之一「本節所規定保證人之權利，除法律另有規定外，不得預先拋棄」，則：", "options": [{"id": "1", "text": "基於法律不溯及既往之原則，因保證契約係簽訂於民法修正條文施行前，若Ａ銀行於89年6月允許借款人延期清償，無須徵得保證人同意，保證人仍應負保證責任。"}, {"id": "2", "text": "若Ａ銀行於89年7月允許借款人延期清償，縱有特約，仍須徵得保證人同意，否則保證人得主張不負保證責任。"}, {"id": "3", "text": "因Ａ銀行與保證人訂有特約，故無須徵得保證人同意，保證人仍應負保證責任。"}], "basis": "【民法第739條之1、民法債編施行法第33條】"}, {"number": 59, "answer": ["1"], "type": "single", "prompt": "當事人所設定之最高限額抵押權若未約定擔保原債權確定之期日，則以下敘述，何者正確？", "options": [{"id": "1", "text": "抵押人得隨時請求確定其所擔保之原債權。"}, {"id": "2", "text": "抵押人未經抵押權人同意，永不得終止抵押契約。"}, {"id": "3", "text": "該抵押權永不消滅。"}], "basis": "【民法第881條之5第1項】"}, {"number": 60, "answer": ["3"], "type": "single", "prompt": "國富有限公司與Ａ銀行簽訂借據後，經股東全體之同意，依法變更其組織為國富股份有限公司。問：國富有限公司變更組織所發生之法律上效果，下列敘述，何者正確？", "options": [{"id": "1", "text": "國富有限公司須為解散登記；國富股份有限公司須為設立登記。"}, {"id": "2", "text": "國富有限公司決議變更組織後，應即通知Ａ銀行，否則不得以其變更組織對抗Ａ銀行。"}, {"id": "3", "text": "國富股份有限公司應承擔變更組織前國富有限公司對Ａ銀行所負之借款債務。"}], "basis": "【公司法第107條、經濟部74年5月13日經商字第19365號函】"}, {"number": 61, "answer": ["2"], "type": "single", "prompt": "吉利股份有限公司與Ｂ銀行簽訂借據後，經股東會以特別決議通過減資。依現行公司法規定，公司決議減資後，應即向各債權人分別通知及公告，並指定三十日以上之期限，聲明債權人得於期限內提出異議。問：下列敘述，何者正確？", "options": [{"id": "1", "text": "若吉利股份有限公司未遵守公司法所定保護債權人之程序而減資，則因違反強制規定，其減資無效。"}, {"id": "2", "text": "若Ｂ銀行遵期異議，則吉利股份有限公司應為清償或提供相當之擔保，否則不得以其減資對抗Ｂ銀行。"}, {"id": "3", "text": "若Ｂ銀行未遵期異議，則視為否認吉利股份有限公司之減資。"}], "basis": "【公司法第281條準用同法第73、74條】"}, {"number": 62, "answer": ["2"], "type": "single", "prompt": "股份有限公司向銀行借款，除法律或該公司章程另有規定外，須經由該公司何種會議議決？", "options": [{"id": "1", "text": "監察人會。"}, {"id": "2", "text": "董事會。"}, {"id": "3", "text": "股東會。"}], "basis": "【公司法第202條、經濟部56年9月7日經商字第23287號函】"}, {"number": 63, "answer": ["3"], "type": "single", "prompt": "甲向Ｂ銀行借款1000萬元，Ｋ公司為下列行為，何者不須注意該公司章程﹖", "options": [{"id": "1", "text": "Ｋ公司為保證人。"}, {"id": "2", "text": "Ｋ公司提供其名下Ａ屋設定抵押權擔保甲向Ｂ銀行之借款。"}, {"id": "3", "text": "甲背書轉讓Ｋ公司所簽發之本票予Ｂ銀行作為還款來源。"}], "basis": "【公司法第16條、最高法院74年台上字第703號判例、79年台上字第1656號判決】"}, {"number": 64, "answer": ["2"], "type": "single", "prompt": "甲公司為乙公司之控制公司，且甲公司對乙公司有新臺幣500萬元附抵押權之債權，乙公司另有一債權人丙銀行，丙銀行對乙公司有新臺幣200萬元之債權。問：此際，若甲公司間接使乙公司為不合營業常規或其他不利益之經營，以致乙公司破產時，何者得優先向乙公司求償？", "options": [{"id": "1", "text": "甲公司"}, {"id": "2", "text": "丙銀行"}, {"id": "3", "text": "依甲公司、丙銀行請求之先後順序而定。"}], "basis": "【公司法第369條之7第2項】"}, {"number": 65, "answer": ["2"], "type": "single", "prompt": "公開發行股票之Ａ股份有限公司向銀行借款，並以其不動產設定抵押權作為擔保。嗣後，該公司向法院聲請重整。法院在為准駁重整之裁定前，業就該公司履行債務及對該公司行使債權作成限制處分。關於限制處分之法律效果，下列敘述何者正確？", "options": [{"id": "1", "text": "銀行不得聲請法院對Ａ公司為拍賣抵押物之裁定"}, {"id": "2", "text": "銀行得對Ａ公司訴請清償屆期未還之借款債務"}, {"id": "3", "text": "Ａ公司得向銀行現實清償借款債務。"}], "basis": "【(1)司法院73.5.11.（73）廳民一字第0366號函。(2)司法院72.6.20.（72）廳民一字第0394號函。(3)公司法第287條】"}, {"number": 66, "answer": ["1"], "type": "single", "prompt": "民事訴訟法中有關訴訟費用之規定，下列敘述何者正確？", "options": [{"id": "1", "text": "訴訟費用，由敗訴之當事人負擔"}, {"id": "2", "text": "原告撤回其訴者，訴訟費用由被告負擔"}, {"id": "3", "text": "訴訟費用之裁判，對於本案判決未提出上訴，仍得聲明不服。"}], "basis": "【民事訴訟法第78、83、88條】"}, {"number": 67, "answer": ["1"], "type": "single", "prompt": "民事訴訟法中有關撤銷假扣押之規定，下列敘述何者正確？", "options": [{"id": "1", "text": "本案訴訟尚未繫屬，如命假扣押之法院依債務人聲請，命債權人於一定期間內起訴，債權人不遵期起訴，債務人得聲請命假扣押之法院撤銷假扣押裁定"}, {"id": "2", "text": "債權人限於假扣押之原因消滅後，始得聲請撤銷假扣押裁定"}, {"id": "3", "text": "債務人不論基於何理由，凡欲聲請撤銷假扣押裁定，均須提供假扣押裁定中所規定之擔保，始得為之。"}], "basis": "【民事訴訟法第529、530條】"}, {"number": 68, "answer": ["2"], "type": "single", "prompt": "合意停止訴訟程序之當事人，自陳明合意停止時起，如於幾個月內不續行訴訟，視為撤回其訴或上訴？", "options": [{"id": "1", "text": "3個月"}, {"id": "2", "text": "4個月"}, {"id": "3", "text": "6個月。"}], "basis": "【民事訴訟法第190條】"}, {"number": 69, "answer": ["3"], "type": "single", "prompt": "訴訟標的為新臺幣(下同)1000萬元之財產權訴訟，經上訴三審後發回更審，當事人對於更審之判決不服而再上訴時，應繳交多少訴訟費用？", "options": [{"id": "1", "text": "10萬元"}, {"id": "2", "text": "15萬元"}, {"id": "3", "text": "無須繳交訴訟費用。"}], "basis": "【民事訴訟法第77條之16第1項】"}, {"number": 70, "answer": ["1"], "type": "single", "prompt": "債務人甲住在台北市中正區，因在台中就讀大學，遂向Ａ銀行台中分行辦理助學貸款，於依約應繳款之期限屆至時，經Ａ銀行催繳卻置之不理，則Ａ銀行得向何法院聲請對甲核發支付命令？", "options": [{"id": "1", "text": "台北地院"}, {"id": "2", "text": "台中地院"}, {"id": "3", "text": "台北地院或台中 廣告業務招攬及營業促銷活動辦法第4條】"}, {"number": 136, "answer": ["1", "2", "3"], "type": "multiple", "prompt": "下列何者正確？", "options": [{"id": "1", "text": "銀行放款屬於消費借貸契約"}, {"id": "2", "text": "銀行支票存款屬於委任契約"}, {"id": "3", "text": "活期存款屬於消費寄託契約。"}], "basis": "【民法第474、602、603、528條、最高法院65年台上1253號判例、73.10.2第11次民事庭會議決議】"}, {"number": 137, "answer": ["1", "2"], "type": "multiple", "prompt": "銀行之活期存款戶甲英年早逝，有妻乙、養女丙、父丁及母戊健在，甲之銀行存款應由何人繼承？", "options": [{"id": "1", "text": "乙"}, {"id": "2", "text": "丙"}, {"id": "3", "text": "丁。"}], "basis": "【民法第1138、1077、1151條】"}, {"number": 138, "answer": ["1", "2", "3"], "type": "multiple", "prompt": "存款戶甲，某日慌張來行表示，其存摺及印章遺失，經調閱錄影帶發現乙冒充甲已盜領新臺幣十萬元，試問，依民法規定，須具備下列何要件，銀行與甲間就該新臺幣十萬元存款已生清償力？", "options": [{"id": "1", "text": "存摺為真正"}, {"id": "2", "text": "印章為真正"}, {"id": "3", "text": "銀行不知乙係冒充的。"}], "basis": "【民法第310條第2款，最高法院73.10.2.第11次民事庭會議決議】"}, {"number": 139, "answer": ["1", "2"], "type": "multiple", "prompt": "甲為乙銀行之存款戶，嗣後，甲於今年ㄧ月間過世。問：下列何者為得繼承甲之存款之直系血親卑親屬？", "options": [{"id": "1", "text": "甲之配偶於婚姻關係存續中受孕而於甲死亡後始出生之子女。"}, {"id": "2", "text": "甲於生前撫育之非婚生子女。"}, {"id": "3", "text": "甲於生前出養予他人之子女，而收養關係仍存續中。"}], "basis": "【民法第1063條第1項、第7條，第1065條第1項，第1077條第2項】"}, {"number": 140, "answer": ["2", "3"], "type": "multiple", "prompt": "以下那幾種請求權消滅時效期間為5年？", "options": [{"id": "1", "text": "借款期限不及1年之本金"}, {"id": "2", "text": "利息"}, {"id": "3", "text": "租金。"}], "basis": "【民法第126條】"}, {"number": 141, "answer": ["1", "2"], "type": "multiple", "prompt": "丙生前向Ｂ銀行借款新臺幣（下同）100萬元，丙之繼承人僅甲乙二人（皆為完全行為能力人），且其等繼承所得遺產之金額超過100萬元，依民法規定，下列有關返還借款債務之敘述何者正確﹖", "options": [{"id": "1", "text": "返還借款之債務，甲乙須連帶負責"}, {"id": "2", "text": "Ｂ銀行得單獨對甲請求返還借款100萬元"}, {"id": "3", "text": "乙給付Ｂ銀行50萬元即可免責。"}], "basis": "【民法第1153、273條】"}, {"number": 142, "answer": ["1", "2"], "type": "multiple", "prompt": "Ａ公司向Ｂ、Ｃ、Ｄ三家銀行聯貸新臺幣3億元，於聯貸合約中約定Ｂ、Ｃ、Ｄ三家銀行對Ａ公司之借款債權係「連帶債權」，下列有關「連帶債權」之敘述，依民法規定，何者正確﹖", "options": [{"id": "1", "text": "債務人得向連帶債權人中之一人為全部之給付"}, {"id": "2", "text": "任一債權人受領全部之給付後，債權即歸於消滅"}, {"id": "3", "text": "連帶債權人中之一人為給付之請求者，其利益或不利益，對他債權人不生效力。"}], "basis": "【民法第283、284、286、285、290條】"}, {"number": 143, "answer": ["1", "2", "3"], "type": "multiple", "prompt": "依金融消費者保護法規定，下列敘述何者錯誤？", "options": [{"id": "1", "text": "金融服務業得藉金融教育宣導，引薦個別金融商品或服務"}, {"id": "2", "text": "金融服務業提供金融商品或服務，應盡一般注意義務；其提供之金融商品或服務具有信託、委託等性質者，並應依所適用之法規規定或契約約定，負忠實義務"}, {"id": "3", "text": "金融消費者就金融消費爭議事件應先向金融服務業提出申訴，金融服務業應於收受申訴之日起二十日內為適當之處理，並將處理結果回覆提出申訴之金融消費者。"}], "basis": "【金融消費者保護法第7、8、13條】"}, {"number": 144, "answer": ["1", "3"], "type": "multiple", "prompt": "甲以其所有之房屋設定抵押權向Ｂ銀行貸款新臺幣一百萬元，嗣後將該房屋出售予乙，買賣契約中約定，由買受人乙承擔房貸債務，甲從此不負房貸責任。上開約定未經Ｂ銀行承認，下列敘述何者正確﹖", "options": [{"id": "1", "text": "因未經Ｂ銀行承認，故該約定對Ｂ銀行不生效力"}, {"id": "2", "text": "甲或乙得定相當期限，催告Ｂ銀行於該期限內確答是否承認，Ｂ銀行逾期不為確答者，視為承認"}, {"id": "3", "text": "Ｂ銀行拒絕承認該買賣契約中有關房貸債務承擔之約定時，甲或乙得撤銷該約定。"}], "basis": "【民法第301、302條】"}, {"number": 145, "answer": ["1", "2"], "type": "multiple", "prompt": "甲向Ｂ銀行貸款新臺幣九十萬元，嗣後無力償還，故邀同乙丙向Ｂ銀行請求由乙丙為債務承擔並聲請展期，承辦人翻閱作業手冊發現，債務承擔契約書格式有二，一為「免責的債務承擔」，一為「併存的債務承擔」，下列敘述何者正確﹖", "options": [{"id": "1", "text": "使用「免責的債務承擔」格式，將使甲脫離債務關係，不再負責"}, {"id": "2", "text": "使用「併存的債務承擔」格式，甲並未脫離債務關係，仍應負責"}, {"id": "3", "text": "使用「併存的債務承擔」格式時，甲乙丙各負給付三十萬元之責任。"}], "basis": "【最高法院49年台上字第2090號判例、85年台上字第1168號判決，民法第273條】"}, {"number": 146, "answer": ["1", "2"], "type": "multiple", "prompt": "甲向Ｂ銀行有多筆貸款共新臺幣五百萬元，清償期屆至，甲無力全部清償，僅能提出新臺幣三百萬元，下列有關「清償之抵充」之敘述，甲與Ｂ銀行間若無特別約定，依民法之規定，何者正確﹖", "options": [{"id": "1", "text": "原則上由甲於清償時，指定其應抵充之債務"}, {"id": "2", "text": "甲所提出之給付，應先抵充費用、次充利息、次充原本"}, {"id": "3", "text": "若多筆債務均已屆清償期，則以擔保最多者，儘先抵充。"}], "basis": "【民法第321、323、322條】"}, {"number": 147, "answer": ["2", "3"], "type": "multiple", "prompt": "以下敘述，依民法之規定，何者正確？", "options": [{"id": "1", "text": "民法上所謂保證之法律關係，存在於債務人與保證人間"}, {"id": "2", "text": "數人保證同一債務者，除契約另有訂定外，應連帶負保證責任"}, {"id": "3", "text": "保證債務之所謂連帶，係指保證人與主債務人負同一債務，對於債權人各負全部給付之責任者而言。"}], "basis": "【最高法院69年台上字第2080號判例、民法第748條、最高法院45年台上字第1426號判例】"}, {"number": 148, "answer": ["2", "3"], "type": "multiple", "prompt": "以下敘述，依民法規定，何者正確？", "options": [{"id": "1", "text": "約定保證人僅於一定期間內為保證者，如債權人於其期間內，對保證人未為訴訟外請求，保證人免其責任。"}, {"id": "2", "text": "保證未定期間者，保證人於主債務清償期屆滿後，得定一個月以上之相當期限，催告債權人於其期限內，向主債務人為審判上之請求。債權人不於期限內向主債務人為審判上之請求者，保證人免其責任。"}, {"id": "3", "text": "就連續發生之債務為保證而未定有期間者，保證人得隨時通知債權人終止保證契約。"}], "basis": "【民法第752、753、754條】"}, {"number": 149, "answer": ["1", "3"], "type": "multiple", "prompt": "股份有限公司向銀行借款時，下列敘述何者正確？", "options": [{"id": "1", "text": "若董事長因請假出國不能行使職權，而公司未設副董事長，且董事長未指定代理人者，如公司設有常務董事，則由常務董事互推一人代理董事長與銀行簽訂借據。"}, {"id": "2", "text": "若董事長業已辭職，而公司設有副董事長者，則當然由副董事長代理董事長與銀行簽訂借據。"}, {"id": "3", "text": "若董事長逃亡，而公司設有副董事長者，則由副董事長代理董事長與銀行簽訂借據。"}], "basis": "【(1)公司法第208條第3項後段。(2)經濟部75.7.8.經商字第29823號函。(3) 最高法院85年台抗字第17號裁定。】"}, {"number": 150, "answer": ["2", "3"], "type": "multiple", "prompt": "Ａ有限公司之章程並無對外得為保證之規定，該公司董事長甲為協助其好友乙獲得Ｂ銀行之融資，遂代表該公司與Ｂ銀行簽訂保證契約為乙作保。問：下列敘述，何者正確？", "options": [{"id": "1", "text": "本案之保證契約業經Ａ有限公司全體股東之同意，故該保證契約絕對有效"}, {"id": "2", "text": "甲代表Ａ有限公司與Ｂ銀行簽訂之保證契約，對Ａ有限公司不生效力"}, {"id": "3", "text": "甲須自負保證責任。"}], "basis": "【公司法第16條第1、2項】"}, {"number": 151, "answer": ["2", "3"], "type": "multiple", "prompt": "大昌股份有限公司向Ｃ銀行借款後，嗣由檢察機關通知中央主管機關撤銷其設立登記。問：下列敘述，何者正確？", "options": [{"id": "1", "text": "大昌股份有限公司之法人人格，於其設立登記經撤銷時，應即歸於消滅，故Ｃ銀行對該公司之債權亦因而消滅。"}, {"id": "2", "text": "大昌股份有限公司對Ｃ銀行所負債務如屆期未還，則Ｃ銀行於該公司辦理清算終結登記前，仍得對該公司起訴請求清償債務。"}, {"id": "3", "text": "大昌股份有限公司之董事長於公司設立登記經撤銷後，如不依法進行清算程序，竟將公司全部資產變賣，分配予各股東，致Ｃ銀行之債權不獲清償，則Ｃ銀行得請求該董事長與該公司負連帶賠償之責。"}], "basis": "【(1)公司法第26條之1準用同法第25條。最高法院81.4.28 81年度第2次民事庭會議決議。(2)公司法第25條。(3)公司法第23條第2項。最高法院65.6.8第5次民庭庭推總會議決議。】"}, {"number": 152, "answer": ["2", "3"], "type": "multiple", "prompt": "欣欣有限公司向Ｄ銀行借款後，與幸福股份有限公司締結合併契約，而由後者為合併後存續之公司。依現行公司法規定，公司決議合併後，應即向各債權人分別通知及公告，並指定三十日以上之期限，聲明債權人得於期限內提出異議。問：下列敘述，何者正確？", "options": [{"id": "1", "text": "若合併之當事公司未遵守公司法所定保護債權人之程序而合併，則因違反強制規定，其合併無效。"}, {"id": "2", "text": "若Ｄ銀行遵期異議，則欣欣有限公司應為清償或提供相當之擔保，否則不得以其合併對抗Ｄ銀行。"}, {"id": "3", "text": "若Ｄ銀行未遵期異議，則視為承認該二公司之合併，亦即欣欣有限公司對Ｄ銀行所負之債務，由幸福股份有限公司概括承受。"}], "basis": "【公司法第113條、第319條（均準用同法第73、74、75條）】"}, {"number": 153, "answer": ["1", "2", "3"], "type": "multiple", "prompt": "下列關於保證人責任之敘述，何者正確？", "options": [{"id": "1", "text": "Ａ公司於經法院裁定重整完成後，重整債權人就因重整計畫而減免之部分債權，得請求Ａ公司之保證人代負履行責任"}, {"id": "2", "text": "Ｂ公司之破產程序終結時，破產債權人之債權如有未受償部分，其請求權對Ｂ公司而言原則上視為消滅，但Ｂ公司之保證人對該未受償部分不得主張免責"}, {"id": "3", "text": "Ｃ公司向法院聲請和解而經法院裁定認可後，縱和解條件為減免Ｃ公司之一部分債務，Ｃ公司之保證人亦不能就原債務減免部分對和解債權人主張免責。"}], "basis": "【(1)公司法第311條第2項、最高法院79年台上字第1301號判例。(2)破產法第149條、最高法院51年台上字第2243號判例(3)破產法第38條】"}, {"number": 154, "answer": ["2", "3"], "type": "multiple", "prompt": "Ａ股份有限公司向銀行借款，並以其不動產設定抵押權作為擔保；其後，該公司經法院裁定准予重整。下列敘述何者正確？", "options": [{"id": "1", "text": "法院為重整裁定後，銀行仍得依其對Ａ公司所取得之拍賣抵押物裁定，聲請強制執行該公司設押之不動產"}, {"id": "2", "text": "法院為重整裁定後，若Ａ公司在銀行有存款，則銀行仍得逕向重整人行使抵銷權，毋庸依重整程序為之"}, {"id": "3", "text": "銀行依法向重整監督人申報債權後，若對其他重整債權人之債權有實體上之爭執，則應在法院就重整債權宣告審查終結以前向法院提出異議，否則該未經異議之債權視為確定。"}], "basis": "【(1)公司法第296條第1項、第2項但書。(2)公司法第296條第2項本文準用破產法第113條第1項、公司法第296條第3項。 (3)公司法第297條第1項前段、第299條第4項。】"}, {"number": 155, "answer": ["1", "2"], "type": "multiple", "prompt": "下列何者可為假扣押之管轄法院？", "options": [{"id": "1", "text": "本案管轄法院"}, {"id": "2", "text": "假扣押標的物所在地之地方法院"}, {"id": "3", "text": "假扣押債權人住所地之地方法院。"}], "basis": "【民事訴訟法第524條】"}, {"number": 156, "answer": ["1", "3"], "type": "multiple", "prompt": "以下何者得為強制執行之執行名義？", "options": [{"id": "1", "text": "確定之終局判決"}, {"id": "2", "text": "訴訟外成立之和解"}, {"id": "3", "text": "依公證法規定得為強制執行之公證書。"}], "basis": "【強制執行法第4條】"}, {"number": 157, "answer": ["1", "2"], "type": "multiple", "prompt": "以下敘述，何者正確？", "options": [{"id": "1", "text": "供拍賣之數宗不動產，其中一宗或數宗之賣得價金，已足清償強制執行之債權額及債務人應負擔之費用時，債務人得指定其應拍賣不動產之部分"}, {"id": "2", "text": "債務人對分配表所載各債權人之債權或分配金額有不同意者，得向執行法院提出書狀，聲明異議"}, {"id": "3", "text": "已查封之不動產，執行法院得因債務人之聲請命付強制管理。"}], "basis": "【強制執行法第96、39、103條】"}, {"number": 158, "answer": ["1", "2"], "type": "multiple", "prompt": "甲為Ａ銀行之負責人，依銀行法規定，Ａ銀行原則上不得對與甲有利害關係之人（如：三親等以內之血親）為無擔保授信。問︰下列何者為甲之「三親等以內之血親」？", "options": [{"id": "1", "text": "甲之外祖父"}, {"id": "2", "text": "甲之同父異母之弟"}, {"id": 本行遵循赤道原則最新版本指引，訂定《赤道原則授信案件辦法》做為赤道原則授信案件風險管理架構，以接軌國際標準，引導企業落實環境保護並重視社會責任。"}], "basis": "【赤道原則】"}, {"number": 4, "answer": ["3"], "type": "single", "prompt": "許多國際主要投資機構認為氣候變遷所衍生的相關風險將嚴重影響各產業的日常營運活動，進而產生過高投資風險並影響投資績效，因此共同創立下列哪一項專案，透過標準化資訊揭露流程，要求企業填寫問卷，以收集所需資訊後進行分析及評比，再提供給相關投資者參考，以鼓勵公私部門與企業測量、管理溫室氣體排放、減少氣候變遷衝擊、促進企業揭露溫室氣體資訊並進行減量。", "options": [{"id": "1", "text": "碳排放專案(Carbon Emission Project, CMP)"}, {"id": "2", "text": "風險管理專案(Risk Management Project,RMP)"}, {"id": "3", "text": "碳揭露專案（Carbon Disclosure Project, CDP）。"}], "basis": "【碳揭露專案CDP】"}, {"number": 5, "answer": ["2"], "type": "single", "prompt": "2019年聯合國環境署金融倡議(Environment Finance Initiative, UNEP FI)與來自世界各地的銀行共同參與制定下列哪一原則，作為全球金融業落實聯合國永續發展目標(SDGs)及巴黎氣候協定之重要標竿。該原則包含「Alignment」（一致性）、「Impact & Target Setting」（衝擊及目標設定）、「Clients & Customers」（委託人及客戶)、「Stakeholders」（利害關係人）、「Governance & Culture」（治理與文化）、「Transparency & Accountability」（透明揭露及當責）等六大框架。", "options": [{"id": "1", "text": "赤道原則"}, {"id": "2", "text": "責任銀行原則"}, {"id": "3", "text": "企業永續發展原則。"}], "basis": "【責任銀行原則】"}, {"number": 6, "answer": ["1"], "type": "single", "prompt": "本行在鑑別、評估及管理氣候與自然風險時，將相關流程與整體風險管理機制進行整合，並透過三道防線架構強化管控。有關三道防線敘述，下列敘述何者正確?", "options": [{"id": "1", "text": "第一道防線為營業單位與業務管理單位"}, {"id": "2", "text": "第二道防線為董事會稽核處"}, {"id": "3", "text": "第三道防線為風險管理部、法令遵循處與其他業務管理單位。"}], "basis": "【臺灣銀行2025氣候暨自然相關財務揭露報告書】"}, {"number": 7, "answer": ["3"], "type": "single", "prompt": "依據國際金融穩定委員會(Financial Stability Board, FSB)所成立的氣候相關財務揭露工作小組將氣候相關風險劃分為兩大類：與低碳經濟相關的轉型風險和與氣候變遷影響相關的實體風險。其中低碳經濟轉型可能需要廣泛的政策、法律、技術和市場變化，才能符合緩解及適應氣候變遷的要求。根據變化的性質、速度與重點，轉型風險可能會為組織帶來不同程度的財務和名譽風險。下列哪項風險不屬於轉型風險?", "options": [{"id": "1", "text": "政策和法規風險"}, {"id": "2", "text": "技術風險"}, {"id": "3", "text": "作業風險。"}], "basis": "【氣候相關財務揭露TCFD】"}, {"number": 8, "answer": ["2"], "type": "single", "prompt": "由國際金融穩定委員會(Financial Stability Board, FSB)所成立的氣候相關財務揭露工作小組（Task Force on Climate-related Financial Disclosures, TCFD），其建立氣候風險與機會揭露框架之核心主軸為何?", "options": [{"id": "1", "text": "包含「計畫」、「執行」、「查核」、「行動」等四大構面"}, {"id": "2", "text": "包含「策略」、「治理」、「風險管理」、「指標和目標」等四大構面"}, {"id": "3", "text": "包含「財務」、「顧客」、「內部流程」、「學習與成長」等四大構面。"}], "basis": "【氣候相關財務揭露TCFD】"}, {"number": 9, "answer": ["1"], "type": "single", "prompt": "_____小組制定了一套揭露建議和指南，鼓勵並使企業和財務部門能夠評估、報告其與自然相關的依賴性、影響、風險和機會並採取行動。其目標是支持全球資金流動從對自然不利的結果轉向對自然有利的結果，並與全球生物多樣性框架保持一致。上述空格指的是?", "options": [{"id": "1", "text": "自然相關財務揭露(The Taskforce on Nature-related Financial Disclosures, TNFD)"}, {"id": "2", "text": "氣候相關財務揭露(The Task Force on Climate-Related Financial Disclosures, TCFD)"}, {"id": "3", "text": "不平等相關財務揭露(The Task Force on Inequality-related Financial Disclosures, TIFD)。"}], "basis": "【自然相關財務揭露TNFD】"}, {"number": 10, "answer": ["1"], "type": "single", "prompt": "聯合國氣候變化綱要公約第26次締約方會議（COP26）於2021年11月達成___協議，該協議重點包含2022年底各國將加強2030年的階段性減碳目標、首次納入逐步減少煤炭使用的承諾、加強對發展中國家的氣候援助、對全球碳交易市場訂出規則等。上述協議指的是?", "options": [{"id": "1", "text": "Glasgow Climate Pact(格拉斯哥氣候協定)"}, {"id": "2", "text": "Energy Saving and Carbon Reduction(節能減碳協定)"}, {"id": "3", "text": "Greenwich Climate Pact(格林威治氣候協定)。"}], "basis": "【Glasgow Climate Pact】"}, {"number": 11, "answer": ["2"], "type": "single", "prompt": "歐盟執委會為落實其永續金融策略的總體改革方案，於2021年3月10日開始實施_______，透過統一標準去揭露和審視金融商品ESG落實程度的規範，以剔除「漂綠」（Greenwashing）金融產品。上述空格應填入?", "options": [{"id": "1", "text": "反漂綠規範(Anti-Greenwashing Guideline, AGG)"}, {"id": "2", "text": "永續金融揭露規範(Sustainable Finance Disclosure Regulation, SFDR)"}, {"id": "3", "text": "責任投資原則(Principles for Responsible Investment, PRI)。"}], "basis": "【Sustainable Finance Disclosure Regulation, SFDR】"}, {"number": 12, "answer": ["1"], "type": "single", "prompt": "____為獨立的國際性組織，自1997年以來率先發布永續發展報告的揭露架構，期望幫助全球企業和政府透過該架構，能有效了解與傳達報導組織的重大永續發展問題所面臨的衝擊及解決之道，該組織推出的____準則，為目前全球使用最廣泛的永續性報導標準。請問以上空格應該分別填入?", "options": [{"id": "1", "text": "全球報告倡議組織(Global Reporting Initiative, GRI)"}, {"id": "2", "text": "英國標準協會(British standards Institution, BSI)"}, {"id": "3", "text": "世界企業永續發展協會(World Business Council For Sustainable Development, WBCSD)。"}], "basis": "【Global Reporting Initiative, GRI】"}, {"number": 13, "answer": ["1"], "type": "single", "prompt": "某委員會成立於2011年，藉由制定出更全面、完整，且質化與量化並行的永續資訊揭露標準，結合ESG各面向指標，滿足投資者的資訊需求，以利於企業更全面展現長期績效與價值；2018年11月該委員會公布了涵蓋五大面向、11項產業別、77項行業別與26項通用ESG（環境、社會和治理）議題的「重大性地圖索引」（Materiality Map），列出可能影響企業財務狀況與營運績效的ESG議題，這套索引逐漸被各國企業採用。以上委員會指的是?", "options": [{"id": "1", "text": "永續會計準則委員會（Sustainability Accounting Standards Board, SASB）"}, {"id": "2", "text": "永續研究發展委員會（Sustainable Development Research Committee, SDRC）"}, {"id": "3", "text": "永續發展委員會（Sustainable Development Committee, SDC）。"}], "basis": "【Sustainability Accounting Standards Board, SASB】"}, {"number": 14, "answer": ["1"], "type": "single", "prompt": "為鼓勵非歐盟國家減少排放，並防止碳洩漏風險，＿＿＿是歐盟對進口到當地的碳密集產品，依照其製程的碳排放量，規定進口商需申報並採購相對應的____憑證，產品才能進入歐盟。若是非歐盟的生產商，只要提供產品在原國家已支付當地碳費相關費用的證明，即可抵銷歐盟＿＿＿憑證的採購費用。請問以上空格指的是?", "options": [{"id": "1", "text": "碳邊境調整機制（Carbon Border Adjustment Mechanism, CBAM）"}, {"id": "2", "text": "碳排放抵銷機制(Carbon Emission Offset Mechanism, CEOM)"}, {"id": "3", "text": "碳排放管理機制(Carbon Emission Management Mechanism, CEMM)。"}], "basis": "【Carbon Border Adjustment Mechanism, CBAM】"}, {"number": 15, "answer": ["2"], "type": "single", "prompt": "歐盟於2020年6月發布以下哪個標準，並在同年7月12日生效，規範確定一項經濟活動(economic activity)是否符合環境永續性(environmentally sustainable)的標準，以確定投資在環境永續的程度，此標準成為多數國家制定相關標準或指引的參考？", "options": [{"id": "1", "text": "歐洲綠色政綱(European Green Deal)"}, {"id": "2", "text": "歐盟永續分類標準(EU Taxonomy)"}, {"id": "3", "text": "綠色經濟活動標準（Green economic activity Standard)。"}], "basis": "【 EU Taxonomy】"}, {"number": 16, "answer": ["2"], "type": "single", "prompt": "環境部已發布「碳費收費辦法」及「自主減量計畫管理辦法」，並公告「碳費徵收對象溫室氣體減量指定目標」完成碳費制度三項配套子法，透過碳定價與市場機制驅動企業低碳轉型，也宣告我國正式邁入「排碳有價」時代。有關我國碳費制度，下列何者為非?", "options": [{"id": "1", "text": "所稱碳費，指對事業經盤查登錄與查驗後之溫室氣體直接排放量及使用電力溫室氣體間接排放量，換算為二氧化碳當量所徵收之費用"}, {"id": "2", "text": "碳費徵收對象為溫室氣體年排放量合計值達五萬公噸二氧化碳當量以上之電力、燃氣供應業及製造業"}, {"id": "3", "text": "碳費徵收對象應於碳費徵收費率公告生效次年起，每年5月底前依前一年度1月1日至12月31日之溫室氣體排放量申報繳費。"}], "basis": "【碳費收費辦法第2、3、4條】"}, {"number": 17, "answer": ["1"], "type": "single", "prompt": "何種債券本息支付條件與發行人可持續發展績效目標(SPT)相連結?", "options": [{"id": "1", "text": "可持續發展連結債券"}, {"id": "2", "text": "可持續發展債券"}, {"id": "3", "text": "社會責任債券。"}], "basis": "【金管會/永續債券】"}, {"number": 18, "answer": ["2"], "type": "single", "prompt": "機構投資人匯集並運用大量資金，對市場及被投資公司影響重大，其在投資或履行受託人責任(fiduciary duty)時，應基於資金提供者之長期利益，關注被投資公司營運狀況，並透過出席股東會、行使投票權、適當與被投資公司之經營階層對話與互動等方式參與公司治理，這就是機構投資人之哪項治理?", "options": [{"id": "1", "text": "財務治理"}, {"id": "2", "text": "盡職治理"}, {"id": "3", "text": "專案治理。"}], "basis": "【機構投資人盡職治理守則】"}, {"number": 19, "answer": ["3"], "type": "single", "prompt": "有關溫室氣體盤查，下列何者為非？", "options": [{"id": "1", "text": "國際間溫室氣體盤查涵蓋範疇可分為直接排放（範疇一）、能源間接排放（範疇二）及其他間接排放（範疇三）"}, {"id": "2", "text": "依環境部溫室氣體排放量盤查登錄及查驗管理辦法規定，事業應辦理排放量盤查的範疇為直接排放及能源間接排放"}, {"id": "3", "text": "溫室氣體盤查係直接達成減碳之主要措施，可立即降低排放量。"}], "basis": "【溫室氣體排放量盤查作業指引】"}, {"number": 20, "answer": ["3"], "type": "single", "prompt": "為因應全球氣候變遷，制定氣候變遷調適策略，降低與管理溫室氣體排放，落實世代正義、環境正義及公正轉型，善盡共同保護地球環境之責任，並確保國家永續發展，政府於112年2月15日公布施行「氣候變遷因應法」，該法第四條明訂本國溫室氣體長期減量目標為民國", "options": [{"id": "1", "text": "119年"}, {"id": "2", "text": "129年"}, {"id": "3", "text": "139年 溫室氣體淨零排放。"}], "basis": "【氣候變遷因應法】"}, {"number": 21, "answer": ["2"], "type": "single", "prompt": "下列有關「氣候變遷因應法」第三條定義的用詞，何者為非?", "options": [{"id": "1", "text": "碳匯：指將二氧化碳或其他溫室氣體自排放源或大氣中持續移除後，吸收或儲存之樹木、森林、土壤、海洋、地層、設施或場所"}, {"id": "2", "text": "碳洩漏：指實施溫室氣體管制，可能導致產業外移至其他碳管制較為嚴格國家，反而增加全球排碳量之情況"}, {"id": "3", "text": "碳足跡：指產品由原料取得、製造、配送銷售、使用及廢棄處理等生命週期各階段產生之碳排放量，經換算為二氧化碳當量之總和。"}], "basis": "【氣候變遷因應法】"}, {"number": 22, "answer": ["3"], "type": "single", "prompt": "為配合國家2050淨零轉型目標，鼓勵金融業協助企業朝永續減碳轉型，金管會與環境部、經濟部、交通部、內政部及農業部共同公告第二版「永續經濟活動認定參考指引」(下稱指引)，以鼓勵金融業將資金導引至永續經濟活動。有關金融業如何應用指引之敘述，何者為非?", "options": [{"id": "1", "text": "金融業可於兼顧風險控管下，將企業揭露或提供其營運之主要經濟活動或專案項目符合指引之情形相關資訊作為投融資評估之考量條件之一"}, {"id": "2", "text": "金融業可依企業揭露或提供相關資訊作為與企業溝通議合的基礎，並以指引作為目標，協助企業規劃減碳轉型或投資計畫，逐步達到指引之永續條件"}, {"id": "3", "text": "金融業可強制要求企業客戶依據指引從事各項經濟活動，否則將不予融資。"}], "basis": "【永續經濟活動認定參考指引第二版問答集】"}, {"number": 23, "answer": ["3"], "type": "single", "prompt": "配合國家2050淨零轉型目標，並鼓勵金融業協助企業朝永續減碳轉型，金管會與環境部、經濟部、交通部、內政部及農業部共同公告第二版「永續經濟活動認定參考指引」(下稱指引)，以下說明何者為非?", "options": [{"id": "1", "text": "指引以「對六項環境目的中的任一項具有實質貢獻，且對六項環境目的及社會保障未造成重大危害」之條件，作為永續經濟活動之認定標準"}, {"id": "2", "text": "指引中，「一般經濟活動」須同時符合「對任一環境目的具有實質貢獻」、「對六項環境目的未造成重大危害」及「對社會保障未造成重大危害」三項條件，始稱為「永續經濟活動」或「符合指引之經濟活動」"}, {"id": "3", "text": "指引目前已涵蓋國內所有產業及經濟活動，所有產業及經濟活動皆適用指引之認定方法。"}], "basis": "【永續經濟活動認定參考指引第二版】"}, {"number": 24, "answer": ["1"], "type": "single", "prompt": "「營運據點因法令改變而鄰近或位於生態保護區，須配合採取因應管理措施或搬遷，導致成本提升」是下列哪一種風險？", "options": [{"id": "1", "text": "法規與政策風險"}, {"id": "2", "text": "技術風險"}, {"id": "3", "text": "市場風險。"}], "basis": "【自然相關財務揭露TNFD】"}, {"number": 25, "answer": ["1"], "type": "single", "prompt": "氣候相關財務揭露工作小組(TCFD)建議揭露管理階層在評估和管理氣候相關風險與機會的角色，屬於四項核心要素當中的哪一項？", "options": [{"id": "1", "text": "治理"}, {"id": "2", "text": "策略"}, {"id": "3", "text": "風險管理。"}], "basis": "【氣候相關財務揭露TCFD】"}, {"number": 26, "answer": ["3"], "type": "single", "prompt": "本行依據科學基礎減量目標倡議（SBTi）規範，決定納入投融資部位碳盤查之資產類別，並遵循金融業全球溫室氣體盤查和報告準則（PCAF）」指引，進行投融資組合碳排放量盤查與計算，主要在計算", "options": [{"id": "1", "text": "範疇一"}, {"id": "2", "text": "範疇二"}, {"id": "3", "text": "範疇三 之溫室氣體排放量。"}], "basis": "【臺灣銀行2025氣候暨自然相關財務揭露報告書】"}, {"number": 27, "answer": ["1"], "type": "single", "prompt": "本行112年7月通過《永續授信政策》，宣布不再新增承作「僅開採煤炭之礦業公司融資案件」以及「興建燃煤電廠之專案融資案件」，展現本行氣候治理及落實永續經營之決心，屬於哪一種氣候變遷風險因應方式?", "options": [{"id": "1", "text": "迴避策略"}, {"id": "2", "text": "調適策略"}, {"id": "3", "text": "承擔策略。"}], "basis": "【臺灣銀行股份有限公司氣候變遷風險管理準則】"}, {"number": 28, "answer": ["3"], "type": "single", "prompt": "為避免辦理授信業務時標榜「綠色」、「社會責任」或「永續」，但有名實未符之狀況或資訊不對稱之情形，訂定《臺灣銀行股份有限公司授信業務防漂綠須知》，關於須知之內容以下何者有誤?", "options": [{"id": "1", "text": "須知適用業務範圍為企業授信，包括但不限於綠色授信、社會責任授信，以及辦理貸款業務連結永續績效指標"}, {"id": "2", "text": "須知所稱「漂綠」，係指本行企業授信業務在永續相關之聲明、行動或陳述中，提供無法令人清楚理解或過於誇大之訊息，或僅選擇性揭露正面影響或缺乏證據支持其永續特徵之訊息，進而可能誤導金融消費者、投資人或其他市場參與者之判斷"}, {"id": "3", "text"     let questions = [];

    const displayAnswer = answer => answer.map(n => `選項 ${n}`).join('、');

    const shuffle = items => {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    };
    function proportionalSample(type, requested) {
      const pools = topics.map(topic => ({ topic, items: topic.questions.filter(q => q.type === type) }));
      const totalWeight = topics.reduce((sum, topic) => sum + topic.questions.length, 0);
      const quotas = pools.map(pool => Math.min(pool.items.length, Math.floor(requested * pool.topic.questions.length / totalWeight)));
      let remaining = requested - quotas.reduce((sum, quota) => sum + quota, 0);
      const order = pools.map((pool, index) => ({ index, remainder: requested * pool.topic.questions.length / totalWeight - quotas[index] })).sort((a, b) => b.remainder - a.remainder);
      for (const entry of order) {
        if (remaining === 0) break;
        if (quotas[entry.index] < pools[entry.index].items.length) { quotas[entry.index]++; remaining--; }
      }
      while (remaining > 0) {
        const available = pools.map((pool, index) => index).filter(index => quotas[index] < pools[index].items.length);
        if (!available.length) break;
        const index = available[Math.floor(Math.random() * available.length)];
        quotas[index]++; remaining--;
      }
      return shuffle(pools.flatMap((pool, index) => shuffle(pool.items).slice(0, quotas[index]).map(q => ({ ...q, topicId: pool.topic.id, topicTitle: pool.topic.title, uid: `${pool.topic.id}-${q.number}` }))));
    }
    function randomQuestions() {

    }
    function render() {
      const isRandom = topicSelect.value === 'random';
      currentTopic = isRandom ? null : topics.find(item => item.id === Number(topicSelect.value));
      questions = isRandom ? randomQuestions() : currentTopic.questions.map(q => ({ ...q, topicId: currentTopic.id, topicTitle: currentTopic.title, uid: `${currentTopic.id}-${q.number}` }));
      const singles = questions.filter(q => q.type === 'single').length;
      const multiples = questions.filter(q => q.type === 'multiple').length;
      document.querySelector('#page-title').textContent = isRandom ? '隨機出題複習' : `${currentTopic.title} 題庫複習`;
      document.querySelector('#topic-summary').textContent = isRandom ? `已依十篇題庫總題數比例隨機抽出 ${questions.length} 題：單選題 ${singles} 題、多選題 ${multiples} 題。再次切換至「隨機出題」可重新抽題。` : `共 ${questions.length} 題：單選題 ${singles} 題、多選題 ${multiples} 題。作答後按各列「改正」。`;
      document.querySelector('#result-summary').textContent = '';
      tableBody.innerHTML = questions.map(q => {
        const inputType = q.type === 'single' ? 'radio' : 'checkbox';
        const options = q.options.map(o => `<label class="option"><input type="${inputType}" name="q${q.uid}" value="${o.id}"><span>${o.id}</span></label>`).join('');
        const sourceMatch = q.prompt.match(/((?:(?:【[^】]*】|〔[^〕]*〕)\s*)+)\s*$/);
        const questionText = sourceMatch ? q.prompt.slice(0, sourceMatch.index).trim() : q.prompt;
        const basis = q.basis || (sourceMatch ? sourceMatch[1] : '—');
        const displayNumber = isRandom ? `${q.topicTitle}－${q.number}` : q.number;
        return `<tr data-id="${q.uid}" data-topic-id="${q.topicId}" data-number="${q.number}" data-type="${q.type}" data-search="${escapeHtml((q.topicTitle + ' ' + q.number + ' ' + q.prompt + ' ' + q.options.map(o => o.text).join(' ')).toLowerCase())}"><td class="number" data-label="題庫號">${escapeHtml(String(displayNumber))}</td><td class="correction" data-label="改正"><button class="correct-one" type="button">改正</button><span class="correct-answer" hidden>${displayAnswer(q.answer)}</span></td><td class="answer" data-label="答案">${options}</td><td data-label="題目"><div class="question-text">${escapeHtml(questionText)} ${q.options.map(o => `<span class="question-option">(${o.id}) ${escapeHtml(o.text)}</span>`).join(' ')}</div></td><td class="basis" data-label="出題依據"><div class="basis-text">${escapeHtml(basis)}</div></td><td class="notes" data-label="筆記"><textarea class="note-input" data-note-number="${q.number}" data-note-topic="${q.topicId}" aria-label="第 ${displayNumber} 題筆記" placeholder="點此輸入筆記"></textarea><div class="note-actions"><button class="save-note" type="button">儲存</button><button class="cancel-note" type="button">取消</button></div></td></tr>`;
      }).join('');
      document.querySelectorAll('.correct-one').forEach(button => button.addEventListener('click', () => correctRow(button.closest('tr'))));
      document.querySelectorAll('input[type=radio], input[type=checkbox]').forEach(input => input.addEventListener('change', () => {
        const row = input.closest('tr'); row.classList.remove('is-correct','is-wrong','is-unanswered'); row.querySelector('.correct-answer').hidden = true;
      }));
      document.querySelectorAll('.note-input').forEach(note => { note.value = localStorage.getItem(noteKey(note.dataset.noteTopic, note.dataset.noteNumber)) || ''; });
      document.querySelectorAll('.save-note').forEach(button => button.addEventListener('click', () => {
        const note = button.closest('.notes').querySelector('.note-input');
        localStorage.setItem(noteKey(note.dataset.noteTopic, note.dataset.noteNumber), note.value);
        button.textContent = '已儲存'; setTimeout(() => button.textContent = '儲存', 1200);
      }));
      document.querySelectorAll('.cancel-note').forEach(button => button.addEventListener('click', () => {
        const note = button.closest('.notes').querySelector('.note-input'); note.value = localStorage.getItem(noteKey(note.dataset.noteTopic, note.dataset.noteNumber)) || '';
      }));
      filterRows();
    }
    function correctRow(row) {
      const q = questions.find(item => item.uid === row.dataset.id);
      const selected = [...row.querySelectorAll('input:checked')].map(input => input.value).sort();
      const right = [...q.answer].sort();
      row.classList.remove('is-correct','is-wrong','is-unanswered');
      row.classList.add(selected.length === 0 ? 'is-unanswered' : selected.length === right.length && selected.every((v,i) => v === right[i]) ? 'is-correct' : 'is-wrong');
      row.querySelector('.correct-answer').hidden = false;
      return row.classList.contains('is-correct');
    }
    function filterRows() {
      const term = document.querySelector('#search').value.trim().toLowerCase();
      const type = document.querySelector('input[name=filter]:checked').value;
      let visible = 0;
      document.querySelectorAll('#questions tr').forEach(row => { const show = (type === 'all' || row.dataset.type === type) && row.dataset.search.includes(term); row.hidden = !show; if (show) visible++; });
      document.querySelector('#count').textContent = `顯示 ${visible} 題`;
    }
    topicSelect.insertAdjacentHTML('beforeend', '<option value="random">隨機出題（70 單選＋5 多選）</option>');
    topics.forEach(topic => topicSelect.insertAdjacentHTML('beforeend', `<option value="${topic.id}">${escapeHtml(topic.title)}</option>`));
    topicSelect.addEventListener('change', render);
    document.querySelector('#search').addEventListener('input', filterRows);
    document.querySelectorAll('input[name=filter]').forEach(input => input.addEventListener('change', filterRows));
    document.querySelector('#correct-visible').addEventListener('click', () => {
      const visibleRows = [...document.querySelectorAll('#questions tr:not([hidden])')];
      const correct = visibleRows.filter(correctRow).length;
      const unanswered = visibleRows.filter(row => row.classList.contains('is-unanswered')).length;
      document.querySelector('#result-summary').textContent = `改正結果：答對 ${correct} 題、答錯 ${visibleRows.length - correct} 題（其中 ${unanswered} 題未作答，已計入答錯）。`;
    });
    document.querySelector('#reset').addEventListener('click', () => { document.querySelectorAll('#questions input').forEach(input => input.checked = false); document.querySelectorAll('#questions tr').forEach(row => { row.classList.remove('is-correct','is-wrong','is-unanswered'); row.querySelector('.correct-answer').hidden = true; }); document.querySelector('#result-summary').textContent = ''; });
    render();
  </script>
</body>
</html>
